name: build

on:
  pull_request:
  push:
    branches: [ '**' ]

jobs:
  build:
    strategy:
      matrix:
        java: [ 21 ]
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v2
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Remove shadow JARs
        run: |
          rm fabric/build/libs/*-dev-shadow.jar
          rm neoforge/build/libs/*-dev-shadow.jar

      - uses: actions/upload-artifact@v4
        name: Upload API Artifacts
        id: upload-api
        with:
          name: markdown_manual-api
          path: ./common/build/libs/*-api.jar
        if: ${{ matrix.os == 'ubuntu-latest' }}

      - uses: actions/upload-artifact@v4
        name: Upload Fabric Artifacts
        id: upload-fabric
        with:
          name: markdown_manual-fabric
          path: ./fabric/build/libs/*.jar
        if: ${{ matrix.os == 'ubuntu-latest' }}

      - uses: actions/upload-artifact@v4
        name: Upload NeoForge Artifacts
        id: upload-neoforge
        with:
          name: markdown_manual-neoforge
          path: ./neoforge/build/libs/*.jar
        if: ${{ matrix.os == 'ubuntu-latest' }}
